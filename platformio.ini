[env:esp32-c3-devkitm-1]
platform = espressif32 @ 6.13.0
board = esp32-c3-devkitm-1
framework = arduino
upload_speed = 115200
monitor_speed = 115200
monitor_filters = time
; Serial uses native USB CDC, never UART0 on motor GPIO20/21.
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
